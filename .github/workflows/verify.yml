name: Verify community Exchange

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:network-admin
      - run: npm run test:discovery
      - run: npm run test:protocol
      - run: npm run test:activity
      - run: npm run test:edge-guard
      - run: npm run test:bootstrap
      - run: npm run build
